<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="780" height="330" fill="#f7f9fc" rx="8"/>
  <text x="24" y="34" font-size="15" font-weight="700" fill="#1b2a4a">Travel Agent — MCP Toolbox for Databases + ADK</text>
  <text x="24" y="54" font-size="12" fill="#5a6b87">Las queries viven en tools.yaml, del otro lado del Toolbox. El agente no tiene SQL.</text>

  <!-- fila principal -->
  <g>
    <rect x="24" y="90" width="150" height="72" rx="8" fill="#e8eefc" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="99" y="120" font-size="13" font-weight="600" fill="#1b2a4a" text-anchor="middle">Usuario</text>
    <text x="99" y="139" font-size="11" fill="#5a6b87" text-anchor="middle">"hoteles en Mendoza"</text>

    <rect x="212" y="78" width="176" height="96" rx="8" fill="#e8eefc" stroke="#3b5bdb" stroke-width="1.5"/>
    <text x="300" y="104" font-size="13" font-weight="600" fill="#1b2a4a" text-anchor="middle">Cliente del agente</text>
    <text x="300" y="124" font-size="11" fill="#5a6b87" text-anchor="middle">Paso 6: agy / claude / codex</text>
    <text x="300" y="141" font-size="11" fill="#5a6b87" text-anchor="middle">Pasos 7-8: agente ADK</text>
    <text x="300" y="160" font-size="11" fill="#5a6b87" text-anchor="middle">(gemini-3.5-flash)</text>

    <rect x="426" y="78" width="160" height="96" rx="8" fill="#e6f6ee" stroke="#159a63" stroke-width="1.5"/>
    <text x="506" y="104" font-size="13" font-weight="600" fill="#12452f" text-anchor="middle">MCP Toolbox</text>
    <text x="506" y="123" font-size="11" fill="#3c6b56" text-anchor="middle">tools.yaml</text>
    <text x="506" y="140" font-size="11" fill="#3c6b56" text-anchor="middle">3 tools + toolset</text>
    <text x="506" y="159" font-size="11" fill="#3c6b56" text-anchor="middle">:5000/mcp</text>

    <rect x="624" y="78" width="132" height="96" rx="8" fill="#fdf0e3" stroke="#c9722a" stroke-width="1.5"/>
    <text x="690" y="104" font-size="13" font-weight="600" fill="#5c3312" text-anchor="middle">Cloud SQL</text>
    <text x="690" y="123" font-size="11" fill="#84592f" text-anchor="middle">PostgreSQL 15</text>
    <text x="690" y="140" font-size="11" fill="#84592f" text-anchor="middle">tabla hotels</text>
    <text x="690" y="159" font-size="11" fill="#84592f" text-anchor="middle">32 hoteles AR/UY/CL</text>
  </g>

  <!-- flechas -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5a6b87"/>
    </marker>
  </defs>
  <line x1="176" y1="126" x2="208" y2="126" stroke="#5a6b87" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="390" y1="126" x2="422" y2="126" stroke="#5a6b87" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="588" y1="126" x2="620" y2="126" stroke="#5a6b87" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="406" y="118" font-size="10" fill="#5a6b87" text-anchor="middle">MCP</text>
  <text x="604" y="118" font-size="10" fill="#5a6b87" text-anchor="middle">SQL</text>

  <!-- vertex -->
  <rect x="212" y="216" width="176" height="56" rx="8" fill="#f3e9fb" stroke="#7b3fb8" stroke-width="1.5"/>
  <text x="300" y="240" font-size="12" font-weight="600" fill="#3d1a5e" text-anchor="middle">Vertex AI — Gemini</text>
  <text x="300" y="258" font-size="11" fill="#684a85" text-anchor="middle">location: global</text>
  <line x1="300" y1="178" x2="300" y2="212" stroke="#5a6b87" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- despliegue -->
  <rect x="426" y="216" width="330" height="56" rx="8" fill="#eef1f6" stroke="#8a97ad" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="591" y="240" font-size="12" font-weight="600" fill="#33415c" text-anchor="middle">Paso 9 (opcional): Cloud Run</text>
  <text x="591" y="258" font-size="11" fill="#5a6b87" text-anchor="middle">servicio toolbox + servicio hotels-service</text>

  <text x="24" y="306" font-size="11" fill="#5a6b87">Basado en el codelab oficial de Google, actualizado a septiembre de 2026.</text>
</svg>
